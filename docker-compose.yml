version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: logitrack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - logitrack-network

  mongodb:
    image: mongo:7
    container_name: logitrack-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - logitrack-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: logitrack-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - logitrack-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: logitrack-kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - logitrack-network

  localstack:
    image: localstack/localstack:latest
    container_name: logitrack-localstack
    restart: unless-stopped

    ports:
      - "4566:4566"

    environment:
      SERVICES: sqs,dynamodb
      DEBUG: 1

    networks:
      - logitrack-network

  auth-service:
    build:
      context: ./auth-service

    container_name: auth-service
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    networks:
      - logitrack-network

  user-service:
    build:
      context: ./user-service

    container_name: user-service
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "8081:8081"

    networks:
      - logitrack-network

  order-service:
    build:
      context: ./order-service

    container_name: order-service
    restart: unless-stopped

    depends_on:
      - postgres
      - kafka

    ports:
      - "8082:8082"

    networks:
      - logitrack-network

  delivery-service:
    build:
      context: ./delivery-service

    container_name: delivery-service
    restart: unless-stopped

    depends_on:
      - postgres
      - kafka

    ports:
      - "8083:8083"

    networks:
      - logitrack-network

  tracking-service:
    build:
      context: ./tracking-service

    container_name: tracking-service
    restart: unless-stopped

    depends_on:
      - mongodb
      - kafka

    ports:
      - "8084:8084"

    networks:
      - logitrack-network

volumes:

  postgres_data:

  mongo_data:

networks:

  logitrack-network:
    driver: bridge